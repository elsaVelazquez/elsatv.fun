name: Sync YouTube Releases

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual trigger
  repository_dispatch:
    types: [once-webhook]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Only ONCE_PAT is needed: links come from manual_links.json, the ONCE
      # store status, and a scrape of the releases page. No YouTube API key.
      - name: Sync releases
        env:
          ONCE_PAT: ${{ secrets.ONCE_PAT }}
        run: python FINAL_SYNC.py

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add kissingface.html lore/songs.json lore/yt_link_cache.json
          git diff --staged --quiet || git commit -m "Auto-update YouTube releases [skip ci]"
          git push
