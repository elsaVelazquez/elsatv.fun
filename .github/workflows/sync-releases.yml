name: Sync YouTube Releases

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual trigger
  repository_dispatch:
    types: [once-webhook]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Sync releases
        env:
          ONCE_PAT: ${{ secrets.ONCE_PAT }}
        run: |
          python youtube_release_sync.py --mode cron

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add kissingface.html
          git diff --staged --quiet || git commit -m "Auto-update YouTube releases [skip ci]"
          git push
